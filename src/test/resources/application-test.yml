spring:
  datasource:
    url: jdbc:h2:mem:unique;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  event:
    dates: 2026-09-21,2026-09-22
    zone-id: Asia/Seoul
    open-at: "09:00"
    close-at: "16:00"
    result-at: "17:00"
    enforce-schedule: false
  cors:
    allowed-origins: http://localhost:5173,https://festival-vault-design.vercel.app
  participant-cookie:
    secure: false
    same-site: Lax
    max-age-days: 30

logging:
  level:
    root: WARN
