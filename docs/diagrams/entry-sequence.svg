 Sans KR, sans-serif" font-size="16" font-weight="700" fill="#087F79">DailyParticipationRepository.saveAndFlush()</text><path d="M 855.0 1042.0 L 1350.0 1042.0" fill="none" stroke="#087F79" stroke-width="2"/><path d="M 1339.9560216565646 1046.4853649836552 L 1350.0 1042.0 L 1339.9560216565646 1037.5146350163448" fill="none" stroke="#087F79" stroke-width="2"/><rect x="915.0" y="1010.0" width="370.0" height="28.0" rx="6.0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="925.0" y="1030.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="16" font-weight="700" fill="#087F79">SubmissionRepository.saveAllAndFlush() · 3행</text><rect x="700.0" y="1071.0" width="310.0" height="43.0" rx="8.0" fill="#FFFFFF" stroke="#CED9E5" stroke-width="1.5"/><text x="747.5" y="1099.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400" fill="#172B46">CreateEntryResponse 구성</text><path d="M 855.0 1160.0 L 1350.0 1160.0" fill="none" stroke="#087F79" stroke-width="2"/><path d="M 1339.9560216565646 1164.4853649836552 L 1350.0 1160.0 L 1339.9560216565646 1155.5146350163448" fill="none" stroke="#087F79" stroke-width="2"/><rect x="955.5" y="1126.0" width="289.0" height="30.0" rx="6.0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="965.5" y="1148.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#087F79">Spring TX: COMMIT · 잠금 해제</text><path d="M 855.0 1246.0 L 465.0 1246.0" fill="none" stroke="#285BC7" stroke-width="2" stroke-dasharray="7 6"/><path d="M 475.0439783434354 1241.5146350163448 L 465.0 1246.0 L 475.0439783434354 1250.4853649836552" fill="none" stroke="#285BC7" stroke-width="2"/><rect x="558.0" y="1213.0" width="210.0" height="30.0" rx="6.0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="568.0" y="1235.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#285BC7">커밋 성공 후 DTO 반환</text><path d="M 465.0 1296.0 L 145.0 1296.0" fill="none" stroke="#285BC7" stroke-width="2" stroke-dasharray="7 6"/><path d="M 155.04397834343538 1291.5146350163448 L 145.0 1296.0 L 155.04397834343538 1300.4853649836552" fill="none" stroke="#285BC7" stroke-width="2"/><rect x="180.5" y="1264.0" width="249.0" height="29.0" rx="6.0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="190.5" y="1285.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#285BC7">200 OK · 응모 내역·남은 기회</text><rect x="60.0" y="1330.0" width="1420.0" height="99.0" rx="12.0" fill="#F4F7FB" stroke="none" stroke-width="1.5"/><text x="82.0" y="1361.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#172B46">실패 처리</text><text x="205.0" y="1361.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400" fill="#526780">@Valid 실패 → 서비스 진입 전 400 / 비즈니스 예외 → 트랜잭션 롤백 후 400·404·409</text><text x="205.0" y="1394.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" fill="#526780">전화번호 UNIQUE 충돌 → DUPLICATE_PHONE_NUMBER (409). flush는 커밋이 아니며 잠금은 트랜잭션 종료까지 유지.</text><path d="M 50.0 1448.0 L 1490.0 1448.0" fill="none" stroke="#CED9E5" stroke-width="2"/><text x="50.0" y="1482.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="16" font-weight="400" fill="#526780">GameController.createEntry → GameService.createEntry 기준. Repository/DB는 한 레인으로 묶었으며 행사 전체의 종료 잠금은 없습니다.</text></svg>
